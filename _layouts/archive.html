---
layout: default
---
<h1>{{ page.title }}</h1>
{{ content }}
{% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
{% for year in years %}
<h2 class="label">{{ year.name }}</h2>
<ul class="posts">
  {% for post in year.items %}
  {% include post-item.html post=post format="%b %-d" %}
  {% endfor %}
</ul>
{% endfor %}
