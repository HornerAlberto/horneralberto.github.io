description: >-
  Alberto D. Horner. Causal reasoning is what intelligence needs to be safe and super.
email: dohalberto at gmail dot com
github_username: HornerAlberto

author:
  name: "Alberto D. Horner"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "AI Consultant with research experience in Causal AI and a biweekly contributor to the causalpython.io newsletter."
  links:
